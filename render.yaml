# Blueprint Render : API Spring Boot (Docker). La base PostgreSQL est chez Neon.
# Render → New → Blueprint → sélectionner ce dépôt. Les valeurs "sync: false" sont demandées à la création.
services:
  - type: web
    name: creno-api
    runtime: docker
    region: frankfurt # même région que la base Neon (eu-central-1)
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo # crée le salon et les comptes de démonstration au premier démarrage
      - key: JWT_SECRET
        generateValue: true
      # Base PostgreSQL hébergée sur Neon (gratuite sans limite de durée, contrairement à celle de Render).
      # Utiliser la connexion directe (sans "-pooler") : Flyway pose des verrous que le pooler ne gère pas.
      - key: DB_URL
        sync: false # ex. jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USER
        sync: false # ex. neondb_owner
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # ex. https://creno.vercel.app
      - key: FRONTEND_URL
        sync: false # même valeur : sert aux liens dans les emails

