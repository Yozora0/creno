services:
  db:
    image: postgres:16-alpine
    container_name: creno-db
    environment:
      POSTGRES_DB: creno
      POSTGRES_USER: creno
      POSTGRES_PASSWORD: creno
    ports:
      - "5432:5432"
    volumes:
      - creno-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creno -d creno"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: creno-backend
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/creno
      DB_USER: creno
      DB_PASSWORD: creno
      JWT_SECRET: ${JWT_SECRET:-change-me-this-is-a-local-dev-secret-of-32-bytes-min}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  creno-db-data:
