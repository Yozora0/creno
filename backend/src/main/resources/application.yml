spring:
  application:
    name: creno
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creno}
    username: ${DB_USER:creno}
    password: ${DB_PASSWORD:creno}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

creno:
  jwt:
    secret: ${JWT_SECRET:change-me-this-is-a-local-dev-secret-of-32-bytes-min}
    expiration: PT8H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  business:
    zone-id: Europe/Paris

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
